<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="hint">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<p class="error-text">{{ error }}</p>{% endfor %}
</div>
